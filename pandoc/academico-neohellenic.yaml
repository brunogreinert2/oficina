# Pandoc defaults — PDF com fonte grega DEDICADA (GFS NeoHellenic)
# Instalar em: C:\Users\bruno\AppData\Roaming\pandoc\defaults\academico-neohellenic.yaml
# Usar com:    pandoc arquivo.md -d academico-neohellenic -o arquivo.pdf
#
# Use este quando quiser que o grego saia em GFS NeoHellenic e o português
# numa fonte latina de sua escolha. O pacote ucharclasses troca a fonte
# automaticamente ao entrar e sair de um bloco Unicode grego — você não
# precisa marcar nada no Markdown.
#
# Custo: a compilação fica mais lenta (o ucharclasses inspeciona caractere a
# caractere). Para uso normal, prefira academico.yaml com uma fonte única.

pdf-engine: xelatex

include-in-header:
  - "C:/Users/bruno/AppData/Roaming/pandoc/preambulo-simbolos.tex"
  - "C:/Users/bruno/AppData/Roaming/pandoc/preambulo-grego.tex"

variables:
  # Cardo já cobre grego politônico sozinha — este perfil só faz sentido
  # se você quiser o grego especificamente na GFS NeoHellenic.
  mainfont: "Cardo"
  mainfontoptions:
    - "BoldItalicFont={Cardo Bold}"
    - "BoldItalicFeatures={FakeSlant=0.2}"
  monofont: "Consolas"
  fontsize: 11pt
  geometry: "a4paper,margin=2.5cm"
  linestretch: 1.15
  indent: false
  colorlinks: true
  linkcolor: RoyalBlue
  urlcolor: RoyalBlue
  lang: pt-BR

number-sections: false
